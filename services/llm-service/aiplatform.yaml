# Sample workload: the platform builds this directory and serves the model below.
name: llm-service
model: qwen2.5-0.5b-instruct
cpu: 2
memory: 1Gi   # model needs ~650 MiB; request == limit, so rollouts need 2x this on one node
environment: dev
port: 8000
context: .
autoscaling:
  min: 1
  max: 3
env:
  LLM_LOG_LEVEL: INFO
