[project]
name = "preview-demo"
version = "0.1.0"
description = "Local rehearsal of a self-service preview deployment"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
