[project]
name = "aiplatform"
version = "0.1.0"
description = "Self-service platform CLI for deploying containerized LLM workloads"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # CLI framework built on Click; gives typed commands and help text.
  "typer>=0.15",
  # Schema validation for aiplatform.yaml with clear error messages.
  "pydantic>=2.9",
  # YAML parsing (safe_load only).
  "pyyaml>=6.0",
  # User-facing terminal output (checklists, tables, colours).
  "rich>=13.9",
  # Claude Messages API for `aiplatform propose` (structured proposals).
  "anthropic>=0.69",
]

[project.scripts]
aiplatform = "aiplatform.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiplatform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
