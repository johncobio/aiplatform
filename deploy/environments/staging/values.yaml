# Environment overrides for `staging` on kind. On EKS this file will switch the
# ingress class to alb and the storage class to gp3/efs.
environment: staging
ingress:
  className: nginx
persistence:
  storageClass: standard
serviceMonitor:
  enabled: true
otel:
  endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318
