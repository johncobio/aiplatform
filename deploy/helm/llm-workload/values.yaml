# Default values. The aiplatform CLI overrides image, resources, model and
# autoscaling from aiplatform.yaml; environments override the rest in
# deploy/environments/<env>/values.yaml.

nameOverride: ""
environment: dev

# Which inference engine serves the model (ADR 0009).
#   builtin         the repo's llm-service image (image.repository/tag, CPU, llama.cpp inside)
#   llamacpp-server upstream ghcr.io/ggml-org/llama.cpp server (CPU, GGUF from the model cache)
#   vllm            vllm/vllm-openai on a GPU node (weights pulled from Hugging Face)
engine:
  type: builtin
  llamacppServer:
    image: ghcr.io/ggml-org/llama.cpp:server-v0.4.1
    parallel: 2            # concurrent slots (-np); each slot shares the context window
    extraArgs: []
  vllm:
    image: vllm/vllm-openai:v0.29.0
    gpus: 1
    maxModelLen: 8192
    dtype: auto
    extraArgs: []
    hfTokenSecret: ""     # name of a Secret with key HF_TOKEN for gated models
  # Init container that fetches a GGUF into the model cache when an engine
  # cannot download by itself (llamacpp-server).
  downloader:
    image: curlimages/curl:8.11.1

image:
  repository: aiplatform/llm-service
  tag: ""            # required for engine builtin; set by the CLI
  pullPolicy: IfNotPresent

replicaCount: 1      # used only when autoscaling.enabled is false

port: 8000

model:
  backend: llamacpp
  name: ""
  url: ""              # GGUF download URL (builtin, llamacpp-server)
  hfRepo: ""           # Hugging Face repo id (vllm)
  contextLength: 4096
  threads: 2

# Extra environment variables for the container.
env:
  LLM_MLOCK: "true"   # pin the model in RAM; the memory request already budgets for it

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  metric: queue          # queue (llm_pending_requests via prometheus-adapter) | cpu
  target: 2              # avg pending requests per pod (queue) or CPU % (cpu)
  scaleDownStabilizationSeconds: 120

# Model cache shared by replicas on one node (RWO). See ADR 0005.
persistence:
  enabled: true
  size: 2Gi
  storageClass: ""   # cluster default
  accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: nginx
  host: ""           # e.g. llm-service.dev.127.0.0.1.nip.io
  annotations: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  annotations: {}    # EKS: eks.amazonaws.com/role-arn for IRSA

# Startup probe tolerates the first-run model download.
probes:
  startupFailureThreshold: 60   # x 10s = 10 minutes
  readinessPeriodSeconds: 10
  livenessPeriodSeconds: 20

# Prometheus Operator ServiceMonitor (requires the CRD; enabled per environment).
serviceMonitor:
  enabled: false
  interval: 15s

# OpenTelemetry: when set, the service exports OTLP traces over HTTP to this endpoint.
otel:
  endpoint: ""      # e.g. http://opentelemetry-collector.observability:4318

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: /metrics

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
