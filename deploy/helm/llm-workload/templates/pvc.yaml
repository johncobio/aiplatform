{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "llm-workload.fullname" . }}-models
  labels:
    {{- include "llm-workload.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # model cache survives uninstall/reinstall
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
