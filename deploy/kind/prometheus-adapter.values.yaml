# prometheus-adapter: serves custom.metrics.k8s.io from Prometheus so HPAs can
# scale on inference signals instead of CPU. The signal is the engine-agnostic
# recording rule aiplatform:llm_pending_requests (deploy/observability/rules.yaml).
prometheus:
  url: http://prom-prometheus.observability.svc
  port: 9090
replicas: 1
resources:
  requests: { cpu: 25m, memory: 48Mi }
  limits: { memory: 160Mi }
rules:
  default: false
  custom:
    - seriesQuery: 'aiplatform:llm_pending_requests{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: { resource: namespace }
          pod: { resource: pod }
      name:
        matches: "^aiplatform:llm_pending_requests$"
        as: "llm_pending_requests"
      metricsQuery: sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)
