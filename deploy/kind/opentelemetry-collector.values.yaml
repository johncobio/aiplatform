# OpenTelemetry Collector: receives OTLP from workloads, forwards traces to Jaeger.
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-k8s
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
serviceMonitor:
  enabled: true   # the collector's own metrics into Prometheus
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 180
      spike_limit_mib: 40
    batch:
      timeout: 2s
  exporters:
    otlp/jaeger:
      endpoint: jaeger.observability.svc.cluster.local:4317
      tls:
        insecure: true
    debug:
      verbosity: basic
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/jaeger]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
